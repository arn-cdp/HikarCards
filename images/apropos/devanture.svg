<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1b4a"/>
      <stop offset="0.45" stop-color="#c2456b"/>
      <stop offset="0.8" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#ffe0a3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffd36b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffc768"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b3a22"/>
      <stop offset="0.5" stop-color="#8a4b2b"/>
      <stop offset="1" stop-color="#6b3a22"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a6e"/>
      <stop offset="1" stop-color="#2c2140"/>
    </linearGradient>
    <pattern id="tone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.1" fill="#1a1028" opacity="0.35"/>
    </pattern>
    <pattern id="toneLight" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.3" fill="#1a1028" opacity="0.22"/>
    </pattern>
    <radialGradient id="lantern" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd1a1"/>
      <stop offset="0.4" stop-color="#ff5b45"/>
      <stop offset="1" stop-color="#b3172b"/>
    </radialGradient>
    <g id="petal">
      <path d="M0 0 C6 -8 14 -6 12 2 C10 8 3 9 0 0 Z" fill="#ffc4d8" stroke="#e57aa0" stroke-width="1.2"/>
    </g>
    <g id="card">
      <rect x="0" y="0" width="54" height="78" rx="5" fill="#fffaf0" stroke="#14091f" stroke-width="3"/>
      <rect x="6" y="6" width="42" height="36" rx="2"/>
      <path d="M27 14 l4 9 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1 Z" fill="#fff" opacity="0.9"/>
      <rect x="6" y="48" width="42" height="4" fill="#14091f" opacity="0.5"/>
      <rect x="6" y="56" width="30" height="3" fill="#14091f" opacity="0.35"/>
      <rect x="6" y="63" width="36" height="3" fill="#14091f" opacity="0.35"/>
    </g>
  </defs>

  <!-- CIEL -->
