</g>
<g fill="#7dff9a" opacity=".25"><circle cx="251" cy="116" r="18"/><circle cx="289" cy="116" r="18"/><circle cx="270" cy="203" r="30"/></g>
<g fill="#5d5243"><polygon points="60,340 80,322 100,340"/><polygon points="460,345 485,320 505,345"/><polygon points="20,355 35,342 50,356"/></g>
<rect width="540" height="380" fill="url(#foil)"/></g></g>
<!-- type line -->
<rect x="36" y="502" width="558" height="42" rx="10" fill="url(#bar)" stroke="url(#gold)" stroke-width="2.5"/>
<text x="56" y="530" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="19" fill="#fff">Créature — Golem</text>
<text x="574" y="530" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#7dff9a" letter-spacing="2">&#9733;&#9733;&#9733;</text>
<!-- text box -->
<rect x="44" y="554" width="542" height="200" rx="10" fill="url(#parch)" stroke="url(#gold)" stroke-width="2.5"/>
<text x="315" y="592" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#22201a"><tspan x="315" dy="0">Gardien. Les créatures adverses doivent</tspan><tspan x="315" dy="27">attaquer le Golem de Granit en priorité.</tspan></text>
<line x1="120" y1="648" x2="510" y2="648" stroke="#a8946a" stroke-width="1.2"/>
<text x="315" y="680" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-style="italic" font-size="18" fill="#5c4f36">« Il veille depuis mille ans sans fermer l&#39;œil. »</text>
