<text x="574" y="530" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#ffb347" letter-spacing="2">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
<!-- text box -->
<rect x="44" y="554" width="542" height="200" rx="10" fill="url(#parch)" stroke="url(#gold)" stroke-width="2.5"/>
<text x="315" y="592" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#22201a"><tspan x="315" dy="0">Vol. Quand le Dragon de Braise entre en jeu,</tspan><tspan x="315" dy="27">il inflige 800 dégâts à chaque créature</tspan><tspan x="315" dy="27">adverse.</tspan></text>
<line x1="120" y1="675" x2="510" y2="675" stroke="#a8946a" stroke-width="1.2"/>
<text x="315" y="707" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-style="italic" font-size="18" fill="#5c4f36">« Son souffle a forgé les premières montagnes. »</text>
