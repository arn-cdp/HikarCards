<rect x="36" y="34" width="558" height="62" rx="12" fill="url(#bar)" stroke="url(#gold)" stroke-width="3" filter="url(#sh)"/>
<g transform="translate(70 65)"><circle r="20" fill="#22103f" stroke="url(#gold)" stroke-width="2.5"/><g><circle r="9" fill="#fff"/><circle cx="5" cy="-3" r="8" fill="#22103f"/></g></g>
<text x="102" y="76" font-family="DejaVu Serif, Georgia, serif" font-weight="bold" font-size="30" fill="#fff">Chevalier d&#39;Obsidienne</text>
<g transform="translate(558 65)"><circle r="23" fill="url(#gold)" stroke="#5a3e0c" stroke-width="2"/><circle r="17" fill="#1b1b24"/>
 <text y="9" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="25" fill="#fff">5</text></g>
<!-- art -->
<rect x="40" y="103" width="550" height="390" rx="9" fill="url(#gold)" filter="url(#sh)"/>
<g transform="translate(45 108)"><g clip-path="url(#artclip)">
<defs>
 <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12051f"/><stop offset=".7" stop-color="#3d1466"/><stop offset="1" stop-color="#7a3cb8"/></linearGradient>
 <linearGradient id="armor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3350"/><stop offset=".5" stop-color="#1b1726"/><stop offset="1" stop-color="#0c0a12"/></linearGradient>
 <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3d1ff"/><stop offset="1" stop-color="#8e5be0"/></linearGradient>
</defs>
<rect width="540" height="380" fill="url(#nsky)"/>
<circle cx="270" cy="170" r="150" fill="#b77cff" opacity=".12"/><circle cx="270" cy="170" r="95" fill="#b77cff" opacity=".12"/>
