<svg xmlns="http://www.w3.org/2000/svg" width="630" height="880" viewBox="0 0 630 880">
<defs>
 <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ffe14a"/><stop offset=".5" stop-color="#3b2a7a"/><stop offset="1" stop-color="#ffe14a"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff4c2"/><stop offset=".5" stop-color="#d9a93a"/><stop offset="1" stop-color="#8a6116"/></linearGradient>
 <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
